[project]
name = "mcp-email-validator"
version = "0.2.0"
description = "A safety-bounded MCP server for email syntax, DNS, and opt-in SMTP checks"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "dnspython>=2.9.0,<3",
  "fastmcp>=4.1.4,<5",
]

[project.scripts]
mcp-email-validator = "mcp_email_validator.cli:main"

[dependency-groups]
dev = ["pytest>=9.2.0,<10"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
