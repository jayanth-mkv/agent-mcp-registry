name: Publish MCP package

on:
  push:
    tags:
      - "mcp-files-v*"
      - "mcp-email-validator-v*"
  workflow_dispatch:
    inputs:
      package:
        description: Package to validate (manual runs never publish).
        type: choice
        required: true
        options:
          - mcp-files
          - mcp-email-validator

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release target
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.target.outputs.package }}
      distribution: ${{ steps.target.outputs.distribution }}
      version: ${{ steps.target.outputs.version }}
      publish: ${{ steps.target.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.13"
          enable-cache: false
      - name: Validate tag and package version
        id: target
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_PACKAGE: ${{ inputs.package }}
        run: >-
          uv run --no-project python .github/scripts/release.py select
          --event "$RELEASE_EVENT" --ref "$RELEASE_REF" --package "$RELEASE_PACKAGE"
      - name: Require releases to come from main
        if: steps.target.outputs.publish == 'true'
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Test release validation
        run: uv run --no-project python -m unittest discover -s .github/tests -v

  build:
    name: Build and test / ${{ matrix.os }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/verify-package
        with:
          package: ${{ needs.prepare.outputs.package }}
      - name: Keep verified Linux distributions
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ needs.prepare.outputs.package }}-${{ needs.prepare.outputs.version }}
          path: dist/${{ needs.prepare.outputs.package }}/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified distributions to PyPI
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.prepare.outputs.distribution }}/${{ needs.prepare.outputs.version }}/
    concurrency:
      group: pypi-${{ needs.prepare.outputs.package }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ needs.prepare.outputs.package }}-${{ needs.prepare.outputs.version }}
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
