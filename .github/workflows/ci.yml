name: MCP package checks

on:
  push:
    branches: [main]
    paths:
      - "mcp-files/**"
      - "mcp-email-validator/**"
      - ".github/actions/verify-package/**"
      - ".github/scripts/release.py"
      - ".github/tests/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
  pull_request:
    paths:
      - "mcp-files/**"
      - "mcp-email-validator/**"
      - ".github/actions/verify-package/**"
      - ".github/scripts/release.py"
      - ".github/tests/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-guards:
    name: Release validation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.13"
          enable-cache: false
      - run: uv run --no-project python -m unittest discover -s .github/tests -v

  packages:
    name: ${{ matrix.package }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        package: [mcp-files, mcp-email-validator]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/verify-package
        with:
          package: ${{ matrix.package }}
