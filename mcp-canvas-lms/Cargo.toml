[package]
name = "mcp-canvas-lms"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A small native MCP server for Canvas LMS students and teachers"
license = "MIT"
readme = "README.md"
repository = "https://github.com/jayanth-mkv/agent-mcp-registry"
homepage = "https://github.com/jayanth-mkv/agent-mcp-registry/tree/main/mcp-canvas-lms"
keywords = ["mcp", "canvas", "lms", "education", "ai"]
categories = ["command-line-utilities", "api-bindings"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
rmcp = { version = "3.8.0", default-features = false, features = ["server"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "io-std"] }
ureq = { version = "=3.5.0", default-features = false, features = ["native-tls-no-default", "json"] }
url = "2.5"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
debug = 0

[profile.test]
debug = 0
