<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Agent MCP Registry map</title><desc id="desc">A caller can select documented Python file-server, Cloudflare Worker, or agent MCP entries. Each crosses its own runtime boundary and returns a runtime-specific result.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#D96A3A"/></marker></defs>
  <rect width="1400" height="720" fill="#F2F6FA"/><rect x="28" y="28" width="1344" height="664" rx="18" fill="none" stroke="#10243A" stroke-width="2"/><rect x="28" y="28" width="270" height="664" rx="18" fill="#10243A"/>
  <text x="72" y="91" fill="#D96A3A" font-family="Courier New,monospace" font-size="11" font-weight="700" letter-spacing="0">AGENT MCP / RUNTIME MAP</text><text x="72" y="160" fill="#F2F6FA" font-family="Georgia,serif" font-size="29" font-weight="700">One caller.</text><text x="72" y="199" fill="#F2F6FA" font-family="Georgia,serif" font-size="23" font-weight="700">Catalog entries.</text><text x="72" y="264" fill="#B9CFDF" font-family="Arial,sans-serif" font-size="14">Independently documented MCP</text><text x="72" y="289" fill="#B9CFDF" font-family="Arial,sans-serif" font-size="14">implementations and patterns.</text>
  <circle cx="441" cy="370" r="93" fill="#FFFFFF" stroke="#10243A" stroke-width="4"/><text x="441" y="359" fill="#10243A" font-family="Georgia,serif" font-size="30" font-weight="700" text-anchor="middle">Developer</text><text x="441" y="395" fill="#496377" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">client or agent</text>
  <g stroke="#10243A" stroke-width="3"><rect x="668" y="138" width="280" height="132" rx="16" fill="#FFFFFF"/><rect x="668" y="304" width="280" height="132" rx="16" fill="#FFFFFF"/><rect x="668" y="470" width="280" height="132" rx="16" fill="#FFFFFF"/><rect x="1081" y="138" width="214" height="132" rx="16" fill="#DCE9F2"/><rect x="1081" y="304" width="214" height="132" rx="16" fill="#DCE9F2"/><rect x="1081" y="470" width="214" height="132" rx="16" fill="#DCE9F2"/></g>
  <g fill="#D96A3A" font-family="Courier New,monospace" font-size="13" font-weight="700"><text x="690" y="170">PYTHON / IMPLEMENTED</text><text x="690" y="336">WORKER / IMPLEMENTED</text><text x="690" y="502">AGENT / SERVICE-DEPENDENT</text></g>
  <g fill="#10243A" font-family="Georgia,serif" font-size="26" font-weight="700"><text x="690" y="213">File server</text><text x="690" y="379">Cloudflare Worker</text></g><text x="690" y="538" fill="#10243A" font-family="Georgia,serif" font-size="22" font-weight="700">Gemini / Postgres</text><text x="690" y="564" fill="#10243A" font-family="Georgia,serif" font-size="22" font-weight="700">agent client</text>
  <g fill="#496377" font-family="Arial,sans-serif" font-size="17"><text x="690" y="243">SSE · HTTP · stdio</text><text x="690" y="409">workers-mcp proxy</text></g><text x="690" y="587" fill="#496377" font-family="Arial,sans-serif" font-size="15">external config required</text>
  <g fill="#10243A" font-family="Georgia,serif" font-size="23" font-weight="700" text-anchor="middle"><text x="1188" y="195">File tools</text><text x="1188" y="361">Greeting / time</text><text x="1188" y="527">Tool results</text></g>
  <g fill="none" stroke="#D96A3A" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"><path d="M534 326L668 213"/><path d="M534 370H668"/><path d="M534 414L668 536"/><path d="M948 204H1081"/><path d="M948 370H1081"/><path d="M948 536H1081"/></g>
  <text x="835" y="655" fill="#496377" font-family="Courier New,monospace" font-size="16" text-anchor="middle">SOLID = CHECKED-IN PATH · SERVICE-DEPENDENT = EXTERNAL CONFIGURATION REQUIRED</text>
</svg>
