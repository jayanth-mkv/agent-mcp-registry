[project]
name = "agent-mcp-registry-files"
version = "0.2.0"
description = "MCP tools for text files inside a configured local workspace"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["fastmcp>=4.1.4,<5"]

[project.urls]
Homepage = "https://github.com/jayanth-mkv/agent-mcp-registry"
Documentation = "https://github.com/jayanth-mkv/agent-mcp-registry/tree/main/mcp-files"
Repository = "https://github.com/jayanth-mkv/agent-mcp-registry"
Issues = "https://github.com/jayanth-mkv/agent-mcp-registry/issues"

[project.scripts]
mcp-files = "mcp_server.cli:main"

[dependency-groups]
dev = ["pytest>=9.2.0,<10"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mcp_server"
